<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>神のFPS - Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #0d0d0d; color: #fff; font-family: 'Oswald', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { text-align: center; background: rgba(255, 255, 255, 0.05); padding: 60px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 0 40px rgba(0, 255, 255, 0.15); }
        h1 { font-family: 'Syncopate'; font-size: 56px; color: #00ffff; text-shadow: 0 0 20px #00ffff; margin-bottom: 40px; }
        input { background: #1a1a1a; border: 2px solid #ff1493; color: #fff; padding: 18px; font-size: 22px; font-family: 'Oswald'; border-radius: 5px; width: 300px; text-align: center; outline: none; margin-bottom: 30px; }
        .btn-group { display: flex; gap: 20px; justify-content: center; }
        button { padding: 15px 40px; font-size: 20px; font-family: 'Oswald'; cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; text-transform: uppercase; }
        .play-btn { background: #007bff; color: white; }
        .play-btn:hover { background: #0056b3; transform: scale(1.05); box-shadow: 0 0 20px #007bff; }
        .score-btn { background: transparent; border: 2px solid #ff1493; color: #ff1493; }
        .score-btn:hover { background: #ff1493; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>神ゲーFPS</h1>
        <input type="text" id="player-name" placeholder="ENTER YOUR NAME" maxlength="12">
        <div class="btn-group">
            <button class="play-btn" onclick="start()">ゲーム</button>
            <button class="score-btn" onclick="location.href='score.html'">スコアボード</button>
        </div>
    </div>
    <script>
        function start() {
            const name = document.getElementById('player-name').value.trim();
            if(!name) return alert("Please enter your name!");
            localStorage.setItem('playerName', name);
            location.href = 'game.html';
        }
    </script>
</body>
</html>
